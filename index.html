<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Asteroid Diego</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 800px;
      height: 600px;
    }

    /* Mandos táctiles y aviso de rotación: ocultos salvo en dispositivo táctil */
    #pad-left, #pad-right, #rotate-notice { display: none; }

    /* ── Modo táctil ─────────────────────────────────────────────────────── */
    html.touch, html.touch body {
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html.touch #stage {
      position: fixed;
      inset: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    html.touch canvas {
      width: 100%;
      height: 100%;
    }

    html.touch #pad-left,
    html.touch #pad-right {
      display: block;
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom) + 14px);
      z-index: 2;
    }
    html.touch #pad-left  { left:  calc(env(safe-area-inset-left)  + 14px); width: 208px; height: 208px; }
    html.touch #pad-right { right: calc(env(safe-area-inset-right) + 14px); }

    .tbtn {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      font: 22px/1 monospace;
      color: rgba(255, 255, 255, 0.75);
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 12px;
      touch-action: none;
      user-select: none;
    }
    .tbtn:active { background: rgba(255, 255, 255, 0.22); }

    /* Cruceta: arriba propulsa, laterales giran, abajo lanza la Bomba Nova */
    .tbtn.up    { left: 70px; top: 0; }
    .tbtn.left  { left: 0;    top: 70px; }
    .tbtn.right { left: 140px; top: 70px; }
    .tbtn.bomb  { left: 70px; top: 140px; visibility: hidden;
                  border-color: rgba(255, 68, 68, 0.7); }
    #pad-left.has-bombs .tbtn.bomb { visibility: visible; }

    .tbtn.fire {
      position: relative;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      font: bold 17px/1 monospace;
      letter-spacing: 1px;
    }

    html.touch #rotate-notice {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      font: bold 22px/1.5 monospace;
      color: #fff;
      background: #000;
      z-index: 10;
    }

    @media (orientation: portrait) {
      html.touch #stage { display: none; }
      html.touch #rotate-notice { display: flex; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="pad-left">
      <button class="tbtn up"    data-key="ArrowUp">▲</button>
      <button class="tbtn left"  data-key="ArrowLeft">◀</button>
      <button class="tbtn right" data-key="ArrowRight">▶</button>
      <button class="tbtn bomb"  data-key="KeyB" id="btn-bomb">💣</button>
    </div>
    <div id="pad-right">
      <button class="tbtn fire" data-key="Space" data-repeat="50">FUEGO</button>
    </div>
  </div>
  <div id="rotate-notice">Gira el dispositivo<br>para jugar</div>
  <script src="game.js"></script>
  <script src="touch.js"></script>
</body>
</html>
